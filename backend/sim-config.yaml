# CITY20 模拟参数唯一出处（03 §8）。调参只改这里，并同步更新 docs/plan/03-sim-engine.md 对应行。
grid_size: 48
cell_size_m: 50

generation:
  # 生成比例目标（01 §2 / 03 §2）；引擎只强制 buildable_ratio_min，其余为质量目标由测试守护
  river_target_pct: [0.03, 0.05]
  hill_target_pct: [0.08, 0.12]
  forest_target_pct: [0.05, 0.08]
  buildable_ratio_min: 0.70
  max_regen_attempts: 20
  # 河道：2–3 格宽随机游走带
  river_width_min: 2
  river_width_max: 3
  # 丘陵：团簇数与椭圆半径（格）；生成后按目标区间补齐/修剪
  hill_clusters: [2, 3]
  hill_radius: [4, 6]
  # 林地：片数与半径（格），优先贴河岸/丘陵边缘
  forest_patches: [4, 6]
  forest_radius: [2.5, 4]
  forest_edge_bias: 0.6
  # 开局简报约束（03 §2 步骤 8）
  height_limit_m: [60, 100]
  green_line_m: 30

economy:
  initial_funds: 5000000      # 初始财政（03 §8）
  demolish_refund: 0.3        # 拆除返还比例（03 §3）
  build_minutes: 15           # 建设期时长（01 §5）
  polish_minutes: 2           # 微调期时长
  briefing_sec: 20            # 开局简报时长
  year_seconds: 300           # 1 游戏年 = 300 现实秒（build 期，03 §5）
  projection_years: 10        # 终局推演年数

residential:
  capacity_res_low: 300       # 住宅容量（03 §8）
  capacity_res_mid: 900
  capacity_res_high: 2400

employment:
  jobs_shop: 80               # 岗位数（03 §8）
  jobs_cbd: 1200
  jobs_light: 900
  jobs_heavy: 2600

traffic:
  bpr_alpha: 0.15             # BPR 参数（03 §8，改动需在 PR 写明平衡性影响）
  bpr_beta: 4
  road_capacity: 800          # 普通道路格通行能力（需求/年）
  highway_capacity: 1500      # 省道格通行能力
  base_road_time_min: 0.5     # 格基准通行时间（分钟）
  metro_fixed_commute_min: 8  # 地铁通勤固定值（含步行+候车）
  metro_coverage_m: 600       # 「地铁沿线」实现半径（03 未定量，PR-07 取地价同口径 600m）
  unreachable_penalty_min: 20 # 不可达比例超阈值时的通勤惩罚（03 §4.7）
  unreachable_share_threshold: 0.05

pollution:
  pollution_heavy: 0.35       # 重工业污染强度（03 §8）
  pollution_light: 0.15       # 轻工业污染强度
  pollution_decay: 0.05       # 每格曼哈顿距离线性衰减

briefing_template: "本地块限高{height_limit_m}m，河道两侧{green_line_m}m绿线，省道保留不可拆。可建设率约{buildable_pct}%。"
