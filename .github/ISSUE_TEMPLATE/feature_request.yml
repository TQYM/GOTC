name: 功能提议
description: 新玩法、新功能或改进建议
title: "[feat] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 从玩家或开发者视角说清痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提议方案
      description: 想怎么做；有替代方案也一并列出
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - frontend
        - backend
        - AI / Prompt
        - 模拟引擎
        - 不确定
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: 期望完成时间（赛程紧张，请给一个优先级理由）
