name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 前端检查：存在 package.json 才真正执行（脚手架落地前自动跳过）
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect frontend project
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ 尚无 package.json，跳过"
          fi
      - uses: actions/setup-node@v5
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: 20
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - name: Install & lint & build
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  # 后端检查：存在 pyproject.toml / requirements.txt 才真正执行
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect backend project
        id: detect
        run: |
          if [ -f backend/pyproject.toml ] || [ -f backend/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/ 尚无依赖清单，跳过"
          fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.exists == 'true'
        with:
          python-version: "3.11"
      - name: Install & lint & test
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: |
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; else pip install -r requirements.txt; fi
          ruff check .
          pytest -q

  docs:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check relative Markdown links
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"(?<!!)(?:\[[^\]]*\])\(([^)]+)\)")
          failures = []
          for source in Path(".").rglob("*.md"):
              if any(part in {".git", ".next", "node_modules", ".venv"} for part in source.parts):
                  continue
              text = source.read_text(encoding="utf-8")
              for raw_target in pattern.findall(text):
                  target = raw_target.strip().split()[0].strip("<>")
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  target_path = target.split("#", 1)[0]
                  if not target_path:
                      continue
                  resolved = (source.parent / target_path).resolve()
                  if not resolved.exists():
                      failures.append(f"{source}: {raw_target}")
          if failures:
              print("Broken relative Markdown links:")
              print("\n".join(failures))
              raise SystemExit(1)
          print("Markdown relative links OK")
          PY
